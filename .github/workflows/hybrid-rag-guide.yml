name: hybrid-rag-guide

on:
  pull_request:
    paths:
      - "projects/hybrid-rag-guide/**"
      - ".github/workflows/hybrid-rag-guide.yml"
  push:
    branches: [main]
    paths:
      - "projects/hybrid-rag-guide/**"
      - ".github/workflows/hybrid-rag-guide.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/hybrid-rag-guide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintaxis de los scripts de la web
        run: for f in assets/js/*.js; do node --check "$f"; done
      - name: Tests del motor simulado
        run: npm test
